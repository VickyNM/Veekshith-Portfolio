# ============================================================
#  PORTFOLIO CONTENT - edit this file, then refresh the browser.
#  Pages: index.html (home), resume.html, project.html?id=...
#  Tips:
#    - Wrap text in "quotes" if it contains a colon (:) or starts with a symbol.
#    - Use spaces, not tabs, for indentation.
#    - Leave a field as "" or [] (or delete it) to hide it on the site.
#    - Each project needs a unique `id` (lowercase, dashes): project.html?id=cozy-words
#
#  Built around the GDC 2026 talk "Designing the Ideal Level Design Portfolio":
#    - Order of projects = order of presentation. Strongest first, balanced flow,
#      impactful ending. Projects with `featured: true` form "Selected work" on the
#      home page; the rest appear under "More work".
#    - Clarity beats quantity: fully explain a few projects rather than listing many.
#    - Every project page is a walkthrough: overview, level map, beats, decisions,
#      iteration and feedback, before/after, GIFs/video, tools and why.
#    - It is a living document: change `site.updated` whenever you edit it.
# ============================================================

site:
  title: "Veekshith Kolanupaka | Game & Level Designer"   # browser tab title
  name: Veekshith Kolanupaka
  headline: "Game Designer / Level Designer"   # immediate signal of focus
  focus: "Mobile puzzle and arcade games"      # one short line under the headline
  tagline: "I design puzzle and arcade levels for mobile, built around clarity, fun and data."
  location: Hyderabad, India
  email: veekshith02kolanupaka@gmail.com
  updated: "November 2026"                     # shown in the footer as "Last updated"
  website:
    label: www.nearmintstudios.com
    url: https://www.nearmintstudios.com/
  resume_pdf: ""          # e.g. "Veekshith_Kolanupaka_CV.pdf" once the file is copied into this folder
  socials: []             # TODO: add links, for example:
  #  - label: LinkedIn
  #    url: https://www.linkedin.com/in/your-name
  #  - label: Itch.io
  #    url: https://your-name.itch.io

about:
  summary: "Game Designer with 3+ years of experience shipping puzzle and arcade games on mobile. Built 15+ games for clients like PlayOn and JustPlay, and tested prototypes with Voodoo and HitApps, iterating on CPI and retention data. Skilled in game mechanics, level design, FTUE and KPI-driven iteration."
  stats:                  # credibility strip on the home page; delete the list to hide
    - value: "3+"
      label: Years experience
    - value: "15+"
      label: Client games built
    - value: "3"
      label: Play Store releases

# Clear areas of expertise (shown on the home page and the resume page)
expertise:
  - name: Level Design
    text: "Puzzle and arcade levels that introduce, reinforce and then twist a mechanic."
  - name: Game Design
    text: "Core mechanics, game flow, upgrade progression and feedback loops."
  - name: FTUE Design
    text: "First-time experiences that teach through play instead of text."
  - name: KPI-driven Iteration
    text: "Tuning games against CPI, retention and playtime from publisher tests."
  - name: Prototyping
    text: "Fast playable builds to test an idea before committing to it."
  - name: Design Documentation
    text: "Clear design docs and briefs that a team can build from."

# Tools grouped by purpose. Add `why` lines on each project page for "tools used and why".
tools:
  - group: Engines
    items: [Unity]
  - group: Design and documentation
    items: [Figma]

experience:
