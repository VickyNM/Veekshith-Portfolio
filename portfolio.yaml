        text: "A fast-paced, chaotic brick-breaker game where players aim to break blocks, dig deeper, and utilize math gates to multiply their balls. Players must manage limited moves, and upgrade abilities using upgrade cards to overcome challenging levels."
      - label: My role
        text: "Game and level designer. I built all 80 levels and the challenge system, and co-designed upgrades and combos."
      - label: Result
        text: "Tested with Voodoo ($1.65 CPI, 30% D1, 10% D7) and notified as a hot prototype."
