    level_type: "Phrase puzzle"
    image: ""                 # TODO: cover image
    summary: "A relaxing word puzzle where players reveal a hidden pop-culture phrase, with a hint shown above it, by making words from a grid of letters. Select tiles, make words, complete the objective, repeat."
    card_summary: "A relaxing word puzzle where players reveal hidden pop-culture phrases."
    tldr:
      - label: The game
        text: "A relaxing word puzzle where players reveal a hidden pop-culture phrase, with a hint shown above it, by making words from a grid of letters. Select tiles, make words, complete the objective, repeat."
      - label: My role
        text: "Level designer for all 120 levels, and co-designer of the game with my partner, who also developed it and designed the UI."
      - label: Result
        text: "5K+ downloads, 900+ reviews and a 4.8 rating on the Play Store."
    scale:
      - {value: "120", label: Levels}
      - {value: "10", label: Phrase categories}
      - {value: "2", label: People on the team}
      - {value: "~6 mo", label: Development time}
    context: ""
    objectives: []
    role: []
    level_map: {src: "", caption: ""}
    beats: []
    media: []                 # TODO: gameplay clips (use tools/compress-video.ps1)
    decisions:
      - title: "A level is a handful of dials"
        text: "Every level is a phrase and a hint, plus the settings that shape how it plays: the number of moves, the mystery tile requirement, the vowel ratio and any words planted in the grid. Phrases come from ten categories: pop culture, idioms, popular sayings, movies, games, monuments, TV shows, books, songs and history. I set all of it in a level tool in Unity."
        media:
          - {src: "images/cozy-words/level-tool.png", caption: "The level tool in Unity: phrase, moves, hint, mystery tile requirement (Word Slider Max), vowel ratio and the starting words planted in the grid (SMOKE and SHORE)"}
      - title: "Teaching the game through the first 29 levels"
        text: "The mystery tile is switched off for the first four levels, then arrives at level 5 with a requirement of 3 and climbs to 5, 6 and 7 over the following levels. The grid grows from 4x4 at level 1 to 5x5 at level 2, and to 6x6 at level 26, where the vowel ratio also rises from 0.42 to 0.46."
    systems:
      - title: "Mystery tile"
        text: "A power-up players charge by playing well. Making a word with letters that are not in the phrase, or that are already revealed, fills a bar. When the bar reaches the level's requirement, the player can use the mystery tile to reveal the least repeated letter in the unfinished part of the phrase. Using it resets the bar."
        points:
          - "A word that does not help with the phrase still moves the player toward a reward."
          - "The requirement (Word Slider Max) is part of each level's design. 0 means the mystery tile is not unlocked yet."
      - title: "Vowel ratio and starting words"
        text: "The grid is filled with random letters. The vowel ratio sets what share of them are vowels, so I can make a level easier or harder to play. I can also plant specific words in the grid to give players a head start."
        points:
          - "Ratios used so far: 0.40 on the 4x4 grid, 0.42 on 5x5 and 0.46 on 6x6."
      - title: "Tile sounds"
        text: "Each tile in a word plays the next note up on a marimba, so the word builds into a rising phrase. There is no randomness: I chose complementary pitches one after another, instead of a Do-Re-Mi scale, to feel more zen and gratifying."
        points:
          - "Layered with relaxed background and ambience tracks."
    iterations:
      - problem: "The HitApps test showed where players failed most and where they left. In my first 20 levels, 12 were flagged, with up to 294 fails on a single level."
        change: "Reworked the whole set. I cut the worst performers, moved the hardest phrases later, and gave hard phrases more moves: Sherlock Holmes went from 10 to 20, and Best Served Cold from 10 to 20."
        outcome: "Fail and churn rates improved, but a few levels still missed the audience, so I kept iterating."
      - problem: "A hint can be right and still not click. Level 1 was Star Wars with the hint \"Galactic Saga\"."
        change: "Rewrote it to \"George Lucas' Epic Space Saga\" and gave the level 500 moves so that nobody could fail it."
        outcome: "Star Wars is famous, but the hint still was not an instant connection for a large share of the audience. In the live game, level 1 is Coca Cola with the hint \"Famous soda brand\"."
      - problem: "Across the later levels, some phrases failed for three reasons: the hint was not good enough, the phrase did not suit the audience, or players did not recognise it."
        change: "Cut them (these were planned for levels 47 to 97) and replaced them with phrases the audience already knows, such as Coca Cola, Minnie Mouse, Peter Parker and Mamma Mia."
        outcome: "The live levels lean into what this audience knows best."
        media:
          - {src: "images/cozy-words/cut-levels.png", caption: "Some of the phrases cut after several rounds of review, with their planned level numbers"}
