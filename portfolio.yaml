# ============================================================
#  PORTFOLIO CONTENT - edit this file, then refresh the browser.
#  Pages: index.html (home), resume.html, project.html?id=...
#  Tips:
#    - Wrap text in "quotes" if it contains a colon (:) or starts with a symbol.
#    - Use spaces, not tabs, for indentation.
#    - Leave a field as "" or [] (or delete it) to hide it on the site.
#    - Each project needs a unique `id` (lowercase, dashes): project.html?id=cozy-words
#
#  Built around the GDC 2026 talk "Designing the Ideal Level Design Portfolio":
#    - Order of projects = order of presentation. Strongest first, balanced flow,
#      impactful ending. Projects with `featured: true` form "Selected work" on the
#      home page; the rest appear under "More work".
#    - Clarity beats quantity: fully explain a few projects rather than listing many.
#    - Every project page is a walkthrough: overview, level map, beats, decisions,
#      iteration and feedback, before/after, GIFs/video, tools and why.
#    - It is a living document: change `site.updated` whenever you edit it.
# ============================================================

site:
  title: "Veekshith Kolanupaka | Game & Level Designer"   # browser tab title
  name: Veekshith Kolanupaka
  headline: "Game Designer / Level Designer"   # immediate signal of focus
  focus: "Mobile puzzle and arcade games"      # one short line under the headline
  tagline: "I design puzzle and arcade levels for mobile, built around clarity, fun and data."
