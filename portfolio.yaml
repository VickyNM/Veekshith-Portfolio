    summary: "A fast-paced, chaotic brick-breaker game where players aim to break blocks, dig deeper, and utilize math gates to multiply their balls. Players must manage limited moves, and upgrade abilities using upgrade cards to overcome challenging levels."
    card_summary: "A fast-paced, chaotic brick-breaker with math gates and upgrade cards."   # short version for the home page card
    tldr:
