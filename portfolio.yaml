# ------------------------------------------------------------
#  PROJECTS  (order here = order on the site)
#
#  draft: true hides a project everywhere on the site (home, project page, menus) so unfinished
#         work is not public. Remove the line when it is ready. To preview drafts locally, add
#         ?drafts=1 to the address, for example http://localhost:8000/?drafts=1
#
#  Basics (used on cards):
#    category: Shipped | Game Jam | Personal | Client
#    engine / platform: shown as badges on the card, e.g. engine: Unity, platform: Play Store
#    image: cover screenshot or GIF, e.g. "images/crash-attack/cover.png"
#
#  Walkthrough (every field is optional; empty ones are hidden):
#    role_title, team, duration, year, level_type
#    context: why the project existed
#    objectives: [design goals]
#    role: [what you personally did]
#    level_map: {src: "images/x/map.png", caption: "..."}
#    beats:       [{title, text, media: [{src, caption}]}]        the level, beat by beat
#    decisions:   [{title, text, media: [{src, caption}]}]        design choices and why
#    iterations:  [{problem, change, outcome, media: [...]}]      problem-solving + feedback
#    before_after:[{label, before, after, caption}]               image paths
#    tools:       [{name, why}]
#    media: GIFs, videos, screenshots. A src can be an image, an .mp4/.webm file, or a YouTube link.
#           Short clips: use .mp4 with `loop: true`. It plays silently on a loop like a GIF, but is
#           about 10x smaller, only downloads when it scrolls into view, and pauses when it leaves.
#           Optional `poster: images/x/frame.jpg` shows a still frame while the clip loads.
#           Keep each clip under about 1 MB: 3 to 8 seconds, 720 px wide at most, no audio track.
#    results: [measurable outcomes and player/publisher feedback]
#    links: [{label, url}]
# ------------------------------------------------------------
