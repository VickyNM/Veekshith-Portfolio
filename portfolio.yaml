# Colours (any CSS colour). Notion palette: warm near-black text, white page, light gray panels, Notion blue accents.
theme:
  primary: "#0B6E99"      # links, chart, focus rings
  accent: "#D3E5EF"       # light blue tag background
  chip: "#F1F1EF"         # gray chips
  ink: "#37352F"          # text
  background: "#FFFFFF"   # page
  soft: "#F7F6F3"         # panels, header, footer
  muted: "#6F6E69"        # secondary text (slightly darker than Notion gray for small-text contrast)
  rule: "#E9E9E7"         # borders

# Dark mode colours (Notion dark). Used when the visitor picks dark mode or their system is set to dark.
theme_dark:
  primary: "#529CCA"
  accent: "#28456C"
  chip: "#2B2B2B"
  ink: "#E6E6E5"
  background: "#191919"
  soft: "#202020"
  muted: "#9B9A97"
  rule: "#2F2F2F"
