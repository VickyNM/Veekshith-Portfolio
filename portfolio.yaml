  - id: cozy-words
    title: Cozy Words
    category: Shipped
    featured: true
    disciplines: [Level Design, Game Design]
    genre: "Word, Puzzle"
    platform: Play Store
    engine: Unity
    year: "2024"
    role_title: "Level Designer and Game Designer"
    team: ""
