  #  - label: LinkedIn
  #    url: https://www.linkedin.com/in/your-name
  #  - label: Itch.io
  #    url: https://your-name.itch.io

about:
  summary: "Game Designer with 3+ years of experience shipping puzzle and arcade games on mobile. Built 15+ games for clients like PlayOn and JustPlay, and tested prototypes with Voodoo and HitApps, iterating on CPI and retention data. Skilled in game mechanics, level design, FTUE and KPI-driven iteration."
  stats:                  # credibility strip on the home page; delete the list to hide
    - value: "3+"
      label: Years experience
    - value: "15+"
      label: Client games built
    - value: "3"
      label: Play Store releases

# Clear areas of expertise (shown on the home page and the resume page)
expertise:
  - name: Level Design
    text: "Puzzle and arcade levels that introduce, reinforce and then twist a mechanic."
  - name: Game Design
    text: "Core mechanics, game flow, upgrade progression and feedback loops."
  - name: FTUE Design
    text: "First-time experiences that teach through play instead of text."
  - name: KPI-driven Iteration
    text: "Tuning games against CPI, retention and playtime from publisher tests."
  - name: Prototyping
    text: "Fast playable builds to test an idea before committing to it."
  - name: Design Documentation
    text: "Clear design docs and briefs that a team can build from."

# Tools grouped by purpose. Add `why` lines on each project page for "tools used and why".
tools:
