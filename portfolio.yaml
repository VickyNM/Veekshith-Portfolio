      - {src: "images/crash-attack/gameplay-2.mp4", poster: "images/crash-attack/gameplay-2-poster.jpg", caption: "Another level: +3 and x3 gates, and a bomb blast pushing the combo from 3x to 9x", loop: true}
    beats: []
    decisions:                # shown as "Level design and decisions"
      - title: "80 levels from modular sections"
        text: "I made small mini-layout sections while building the levels, then mixed and matched them to create unique flows and a chaotic feel. The levels use 14 unique obstacles. A further 80 mirrored versions of the original levels added more gameplay time."
        media:
          - {src: "images/crash-attack/mini-sections.png", caption: "A few of the mini-layout sections"}
          - {src: "images/crash-attack/level-layout-a.png", caption: "Level 2 in full (scroll to see the whole level)", tall: true}
          - {src: "images/crash-attack/level-layout-b.png", caption: "Level 35 in full (scroll)", tall: true}
      - title: "Block health that grows as you dive"
        text: "Each level sets a minimum and maximum block health, and every block picks a random value between the two when it spawns. As the player breaks blocks and moves down the level, health rises: after every set distance down (the offset), it goes up by a set amount (the modifier). Both settings change level by level, from +2 every 9 units of depth at level 1 to +8 every 3 at level 80."
      - title: "Math gates"
        text: "Two types, multipliers and adders, a mechanic popularised by games like Mob Control. They add another layer of chaos and juice to each level."
        media: []             # TODO: GIF of the gates
    systems:
      - title: "Challenges"
        text: "A meta system that gives players goals beyond beating the level, rewarding in-game currency. Every level has three challenges drawn from eight types, and each challenge is specific to its level."
        points:
          - "Drafted the values on a sheet, then rebalanced them after internal testing (see the balancing table below)."
      - title: "Permanent upgrades"
        text: "Players spend in-game currency to permanently upgrade ball damage, ball count, crit chance and more."
        points:
          - "I owned what came next in the skill tree and the cost of each next upgrade."
      - title: "In-level upgrade cards"
        text: "A card appears after every X blocks broken. After each claim the requirement rises by Y and the counter resets."
        points:
          - "Standard rarities spawn at 60% Uncommon, 35% Rare and 5% Legendary. Mythic cards are added to the pool as the player progresses through the levels."
          - "Each upgrade has its own value, spawn probability, and a pick limit that depends on its rarity."
          - "All values are tuned in the Unity inspector."
        media_label: "View the Unity inspector screenshots"
        media:
          - {src: "images/crash-attack/cards-rarity.png", caption: "Rarity spawn chances in the Unity inspector"}
          - {src: "images/crash-attack/cards-upgrades.png", caption: "Upgrade entries: type, rarity, pick limit, value and probability"}
      - title: "Combo system"
        text: "The more blocks you break, the higher your combo climbs. The combo breaks when the balls return without breaking a single block in a turn."
        points:
          - "I balanced the combo rewards."
    iterations:
      - problem: "In early playtests the balls kept bouncing from side to side without coming back, so turns dragged on."
        change: "Limited the number of collisions a ball can have without hitting a block to 6. An invisible counter resets whenever the ball hits a block. The ball turns redder as it nears the limit, then returns to the top of the screen once fully red."
        outcome: "Turn times improved, and testers understood the red ball without being told."
        media:
          - {src: "images/crash-attack/ball-red.mp4", poster: "images/crash-attack/ball-red-poster.jpg", caption: "The ball turns redder as it nears the collision limit, then returns to the top", loop: true}
      - problem: "Internal testing showed some challenges were too easy and others too hard to finish in a single try."
        change: "Went back to the sheet and rebalanced the target value of each challenge, level by level. I replayed the same levels many times, watched the average flow of a run, and set each value to what was realistically achievable."
        outcome: "Players could finish all of a level's challenges in one go, which made the game more satisfying."
